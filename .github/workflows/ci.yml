name: CI

on:
  pull_request:
  push:
    branches: [main]

# Default to least privilege; jobs opt into more only if they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  json:
    name: validate-json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate connector config is well-formed JSON
        # This is a content-free thin client: the whole product surface is these
        # three JSON files, so a parse check is the meaningful gate here.
        run: |
          set -euo pipefail
          for f in .mcp.json .claude-plugin/marketplace.json .claude-plugin/plugin.json; do
            echo "Validating $f"
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
          echo "All connector config files are valid JSON."

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks-action scans the PR / push diff by default; no full history
          # needed (and we deliberately do NOT force a full-history rescan — see
          # .gitleaks.toml). fetch-depth: 0 only matters for full scans.
          fetch-depth: 0

      - name: gitleaks
        # Pinned to gitleaks-action v2.3.9 by commit SHA (third-party action).
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          # Scan the PR diff on pull_request and the pushed range on push — this is
          # the action's default behavior; we are explicit about not forcing a full
          # rescan so a historical placeholder can never turn this gate permanently red.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
